<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>81 promised, 57 delivered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E8EAE4;
    --panel:#F4F5F0;
    --ink:#20241F;
    --ink-soft:#4B5148;
    --teal:#1F6F5C;
    --rust:#B5482F;
    --line:#C9CDC2;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Source Serif 4", Georgia, serif;
    line-height:1.45;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  #root{ width:100%; max-width:600px; }

  .provenance{
    font-family:"Archivo", sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:18px;
    letter-spacing:0.01em;
  }

  h1{
    font-family:"Source Serif 4", Georgia, serif;
    font-weight:600;
    font-size:28px;
    line-height:1.28;
    margin:0 0 28px 0;
    max-width:22ch;
  }

  .guess-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }

  .guess-digit-shell{
    font-family:"Archivo", sans-serif;
    font-weight:800;
    font-size:64px;
    color:var(--teal);
    min-width:1.6em;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  .percent-sign{
    font-family:"Archivo", sans-serif;
    font-weight:700;
    font-size:28px;
    color:var(--ink-soft);
  }

  input[type="range"]{
    width:100%;
    margin:6px 0 4px 0;
    accent-color:var(--teal);
  }
  input[type="range"]:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:4px;
  }

  .slider-labels{
    display:flex;
    justify-content:space-between;
    font-family:"Archivo", sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:26px;
  }

  button{
    font-family:"Archivo", sans-serif;
    font-weight:700;
    font-size:15px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:14px 22px;
    border-radius:3px;
    cursor:pointer;
  }
  button:hover{ background:#343a2f; }
  button:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:3px;
  }

  .board{
    margin-top:36px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
  }
  @media (max-width:520px){
    .board{ grid-template-columns:1fr; }
  }

  .flap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:18px 14px 16px 14px;
    text-align:left;
  }
  .flap-label{
    font-family:"Archivo", sans-serif;
    font-weight:600;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .flap-number{
    font-family:"Archivo", sans-serif;
    font-weight:800;
    font-size:44px;
    font-variant-numeric:tabular-nums;
    position:relative;
  }
  .flap-number::after{
    content:"";
    position:absolute;
    left:0; right:0; top:50%;
    height:1px;
    background:rgba(0,0,0,0.18);
  }
  .flap.miss .flap-number{ color:var(--rust); }
  .flap.target .flap-number{ color:var(--teal); }

  @keyframes settle{
    from{ transform:translateY(-6px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  .board .flap{ animation:settle 260ms ease-out backwards; }
  .board .flap:nth-child(1){ animation-delay:0ms; }
  .board .flap:nth-child(2){ animation-delay:90ms; }
  .board .flap:nth-child(3){ animation-delay:180ms; }
  @media (prefers-reduced-motion: reduce){
    .board .flap{ animation:none; }
  }

  .verdict{
    margin-top:26px;
    font-size:17px;
  }
  .verdict strong{ color:var(--rust); font-weight:600; }

  .footnote{
    margin-top:34px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-family:"Archivo", sans-serif;
    font-size:12px;
    line-height:1.6;
    color:var(--ink-soft);
  }

  .again-link{
    display:inline-block;
    margin-top:22px;
    font-family:"Archivo", sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="data.js"></script>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState } = React;

function App(){
  const d = ED_WAIT_DATA;
  const [guess, setGuess] = useState(50);
  const [revealed, setRevealed] = useState(false);

  const gap = d.target_2025_26 - d.outcome_2025_26;

  function verdictLine(){
    const diff = Math.abs(guess - d.outcome_2025_26);
    if (diff <= 3) {
      return <span>You guessed <strong>{guess}</strong>. That's almost exactly right, the real number was <strong>{d.outcome_2025_26}</strong>.</span>;
    }
    if (guess > d.outcome_2025_26) {
      return <span>You guessed <strong>{guess}</strong>. The real number was <strong>{d.outcome_2025_26}</strong>, {diff} points lower than you thought.</span>;
    }
    return <span>You guessed <strong>{guess}</strong>. The real number was <strong>{d.outcome_2025_26}</strong>, {diff} points higher than you thought.</span>;
  }

  if (!revealed){
    return (
      <div>
        <div className="provenance">2026–27 ACT Budget, one row</div>
        <h1>Out of 100 people who walked into a Canberra ER, how many got out within four hours?</h1>
        <div className="guess-row">
          <div className="guess-digit-shell">{guess}</div>
          <div className="percent-sign">%</div>
        </div>
        <input
          type="range"
          min="0"
          max="100"
          value={guess}
          onChange={e => setGuess(Number(e.target.value))}
          aria-label="Your guess, percent"
        />
        <div className="slider-labels"><span>0</span><span>100</span></div>
        <button onClick={() => setRevealed(true)}>Show me the real number</button>
      </div>
    );
  }

  return (
    <div>
      <div className="provenance">2026–27 ACT Budget, one row</div>
      <h1>{d.indicator}.</h1>

      <div className="board">
        <div className="flap target">
          <div className="flap-label">2025–26 target</div>
          <div className="flap-number">{d.target_2025_26}</div>
        </div>
        <div className="flap miss">
          <div className="flap-label">2025–26 actual</div>
          <div className="flap-number">{d.outcome_2025_26}</div>
        </div>
        <div className="flap target">
          <div className="flap-label">2026–27 target</div>
          <div className="flap-number">{d.target_2026_27}</div>
        </div>
      </div>

      <p className="verdict">{verdictLine()}</p>
      <p className="verdict">The government missed its own target by <strong>{gap} points</strong>, and set next year's target at the same {d.target_2026_27}, not lower.</p>

      <button className="again-link" onClick={() => { setRevealed(false); }}>Guess again</button>

      <div className="footnote">
        Source: {d.source.file}, row {d.source.row}. {d.source.statement}, {d.source.agency}, Table {d.source.table}, {d.source.caption}.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
